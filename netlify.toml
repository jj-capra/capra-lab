# Capra Lab on Netlify.
#
# The hub is static. Native games are copied into public/<game>/ by the build,
# and their APIs are Netlify Functions. Each route is mapped in exactly one
# place: a rule below, or a function's own config.path (Swerve Planet, Mind
# Heist), never both, because two systems claiming one route is a known way to
# get a 404 from both.

[build]
  command = "node scripts/build.mjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Lab-wide profiles: one name + six-digit key for every game.
[[redirects]]
  from = "/api/profile/*"
  to = "/.netlify/functions/profile/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200
  force = true

# Primal Survival's game API.
[[redirects]]
  from = "/primal-survival/api/*"
  to = "/.netlify/functions/primal-survival/:splat"
  status = 200
  force = true

# Netlify matches /x and /x/ as the same path, so never add a rule that sends /x to /x/: it sends
# /x/ to itself forever (that broke the Glacial Maw and Mind Heist tiles on Nov 7 2026). The hub
# links every game with the trailing slash.

# Glacial Maw keeps its own Netlify site, server and data (hunters, friends, saved games); Capra Lab serves it
# at /glacial-maw/ so it shares the lab's address. Its pages use relative paths; its one absolute path, the
# server at /api/world, is passed through too. Nothing in the game's repo has to change for this.
[[redirects]]
  from = "/glacial-maw/*"
  to = "https://glacialmaw.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/world"
  to = "https://glacialmaw.netlify.app/api/world"
  status = 200
  force = true

# Mind Heist is native: Capra Lab's build puts the app in public/mind-heist/ and its server in
# netlify/functions/mind-heist.mjs, which claims /mind-heist/api/* through its own config.path (a
# path-configured function runs before these rules, so no API rule here). Invite links
# (/mind-heist/ABCD), /r/, /c/, /tv/ and /jam all load the app; real files are served as they are.
[[redirects]]
  from = "/mind-heist/*"
  to = "/mind-heist/index.html"
  status = 200

# Punchline is native too: its server claims /punchline/api/* through its own config.path
# (netlify/functions/punchline.mjs). Room links (/punchline/ABCD) load the page; real files are
# served as they are.
[[redirects]]
  from = "/punchline/*"
  to = "/punchline/index.html"
  status = 200

# Classified: its server claims /classified/api/* through its own config.path
# (netlify/functions/classified.mjs). Room links (/classified/ABCD) and share files
# (/classified/file/<id>) load the page; real files are served as they are.
[[redirects]]
  from = "/classified/*"
  to = "/classified/index.html"
  status = 200

# No Cap: its server claims /no-cap/api/* through its own config.path (netlify/functions/no-cap.mjs).
# Room links (/no-cap/ABCD) and challenge links (/no-cap/c/<id>) load the page.
[[redirects]]
  from = "/no-cap/*"
  to = "/no-cap/index.html"
  status = 200

# Modules must be served as JavaScript or the browser refuses them.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Goat Getaway's page imports its puzzle rules as shared/puzzle.mjs (the file its server uses too)
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/mind-heist/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/mind-heist/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/mind-heist/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
