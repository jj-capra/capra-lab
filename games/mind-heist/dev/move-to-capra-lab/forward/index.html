<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mind Heist has moved to Capra Lab</title>
<script>
  // Mind Heist lives in Capra Lab now. Go to the same place there (invite links keep their code),
  // and bring this phone's sign-in along after the # so the player stays signed in. Capra Lab's
  // Mind Heist takes it and wipes it from the address bar.
  (function () {
    var dest = 'https://capra-lab.netlify.app/mind-heist' + location.pathname + location.search;
    try { var a = localStorage.getItem('mh.auth'); if (a) dest += '#mh-move=' + encodeURIComponent(a); } catch (e) {}
    location.replace(dest);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://capra-lab.netlify.app/mind-heist/"></noscript>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    box-sizing: border-box; background: #10142b; color: #fff8ec; font: 600 18px/1.4 system-ui, -apple-system, sans-serif; text-align: center; }
  a { color: #ffd23f; }
</style>
</head>
<body>
  <p>Mind Heist has moved to <a href="https://capra-lab.netlify.app/mind-heist/">Capra Lab</a>.</p>
</body>
</html>
