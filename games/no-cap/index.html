<!doctype html>
<html lang="en">
<head>
<script src="/lab/brew.js" data-invite="^/no-cap/([A-Z]{4}|c/[a-z0-9]{8})/?$"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>No Cap · Capra Lab</title>
<meta name="description" content="Three facts. One cap. Someone reads it with a straight face; you find the facts. A Capra Lab party game.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14122A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capra Lab">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E0C1C;
    --night: #14122A;
    --panel: #221F40;
    --panel2: #2E2A52;
    --paper: #FFF8EC;
    --yellow: #FFD23F;
    --cap: #FF3B5C;
    --fact: #3BE38C;
    --blue: #3D7BFF;
    --cyan: #2DD8F0;
    --shadow: #05030E;
    --dim: rgba(255, 248, 236, 0.72);
    --display: Bangers, Impact, "Arial Narrow Bold", system-ui, sans-serif;
    --sl: env(safe-area-inset-left);
    --sr: env(safe-area-inset-right);
    --st: env(safe-area-inset-top);
    --sb: env(safe-area-inset-bottom);
    --gut: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    background-color: var(--night);
    background-image: radial-gradient(rgba(255, 248, 236, 0.07) 1px, transparent 1.6px);
    background-size: 9px 9px;
    color: var(--paper);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* an opaque strip behind the iPhone clock, so nothing scrolls into it */
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--st); background: var(--night); z-index: 35; pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: 0.45; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  [hidden] { display: none !important; }
  a { color: var(--yellow); font-weight: 800; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0.04em; margin: 0; }
  .muted { color: var(--dim); }

  /* ---------- bars: nothing under the iPhone clock ---------- */
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(var(--st) + 10px) max(var(--gut), var(--sr)) 6px max(var(--gut), var(--sl));
    max-width: 640px; margin: 0 auto;
  }
  .bar-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .bar-title { font-family: var(--display); font-size: 21px; letter-spacing: 0.06em; color: var(--yellow); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .round-btn {
    flex: none; min-width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; padding: 0 12px;
    background: var(--panel); border: 2px solid var(--shadow); font-family: var(--display); font-size: 20px; line-height: 1; letter-spacing: 0.06em;
  }
  .wrap {
    max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    padding: 4px calc(var(--sr) + var(--gut)) calc(var(--sb) + 28px) calc(var(--sl) + var(--gut));
  }

  /* ---------- the logo ---------- */
  .hero { text-align: center; padding: 6px 0 0; display: grid; justify-items: center; gap: 8px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(54px, 17vw, 96px); line-height: 0.9; color: var(--yellow); letter-spacing: 0.04em;
    text-shadow: 4px 4px 0 var(--cap), 7px 7px 0 var(--shadow); transform: rotate(-3deg); white-space: nowrap; }
  .logo svg { width: 0.9em; height: 0.9em; flex: none; filter: drop-shadow(4px 4px 0 var(--shadow)); }
  .tagline { margin: 4px 0 0; color: var(--dim); font-weight: 700; font-size: 15px; max-width: 340px; line-height: 1.4; }
  .brewnote {
    justify-self: center; margin: 0; display: inline-flex; gap: 6px; align-items: center;
    background: var(--panel); border: 2px dashed rgba(255, 210, 63, 0.6); color: var(--yellow);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
  }

  /* ---------- cards, buttons, fields ---------- */
  .card { background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 5px 6px 0 var(--shadow); padding: 16px; display: grid; gap: 12px; }
  .card h2 { font-size: 28px; color: var(--yellow); }
  .note { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 18px;
    border-radius: 14px; border: 3px solid var(--ink); background: var(--yellow); color: var(--ink);
    box-shadow: 4px 5px 0 var(--shadow); font-weight: 900; font-size: 17px; text-decoration: none;
  }
  .btn:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn.big { min-height: 58px; font-size: 22px; font-family: var(--display); font-weight: 400; letter-spacing: 0.06em; }
  .btn.alt { background: var(--panel2); color: var(--paper); }
  .btn.cyan { background: var(--cyan); }
  .btn.sm { min-height: 40px; padding: 6px 12px; font-size: 14px; border-radius: 11px; box-shadow: 3px 3px 0 var(--shadow); }
  .btn.wide { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .btn { flex: 1 1 auto; }
  .field { display: grid; gap: 4px; }
  .field span { font-size: 11px; font-weight: 900; color: var(--dim); letter-spacing: 0.08em; }
  .field input {
    width: 100%; min-height: 50px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 8px 12px; font: 800 18px Inter, system-ui, sans-serif;
  }
  .field input.code { font-family: var(--display); font-weight: 400; font-size: 32px; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; }
  .as { font-weight: 800; font-size: 16px; min-height: 30px; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }

  /* ---------- the deck picker ---------- */
  .shelves { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .shelves::-webkit-scrollbar { display: none; }
  .shelves button { flex: none; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 2.5px solid var(--ink); background: var(--panel2); font-weight: 900; font-size: 14px; }
  .shelves button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
  .decks { display: grid; gap: 10px; }
  .deck { text-align: left; display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 4px 5px 0 var(--shadow); }
  .deck b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.04em; line-height: 1; }
  .deck span { font-size: 13px; font-weight: 700; color: rgba(14, 12, 28, 0.72); line-height: 1.35; }
  .deck small { font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: var(--blue); }

  /* ---------- the lobby ---------- */
  .codebox { text-align: center; display: grid; gap: 4px; justify-items: center; }
  .codebox b { font-family: var(--display); font-weight: 400; font-size: 64px; letter-spacing: 0.18em; color: var(--yellow); line-height: 1; padding-left: 0.18em; }
  .people { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .people li { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); font-weight: 900; font-size: 15px; }
  .people li small { font-size: 10px; letter-spacing: 0.08em; color: var(--blue); }
  .people li button { border: 0; background: none; padding: 0 0 0 4px; font-weight: 900; font-size: 16px; color: var(--cap); }

  /* ---------- a card in play ---------- */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 900; font-size: 13px; letter-spacing: 0.06em; color: var(--dim); }
  .hud b { color: var(--yellow); font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0.06em; }
  .clock { position: relative; height: 16px; border-radius: 999px; background: var(--panel2); border: 2.5px solid var(--ink); overflow: hidden; }
  .clock i { position: absolute; inset: 0; transform-origin: left; background: var(--yellow); }
  .clock.low i { background: var(--cap); }
  .banner { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 6px 0 2px; }
  .banner .big { font-family: var(--display); font-size: clamp(34px, 11vw, 54px); line-height: 0.95; letter-spacing: 0.04em; color: var(--yellow); text-shadow: 3px 3px 0 var(--shadow); overflow-wrap: anywhere; }
  .banner .mic { font-size: 54px; line-height: 1; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }
  .sentence { margin: 0; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 6px 0 var(--shadow);
    padding: 16px; font-weight: 800; font-size: clamp(18px, 5vw, 22px); line-height: 1.45; }
  .sentence .cl { background: rgba(61, 123, 255, 0.16); border-radius: 6px; padding: 1px 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .sentence .cl.capped { background: rgba(255, 59, 92, 0.22); text-decoration: underline 3px var(--cap); text-underline-offset: 4px; }
  .sentence .tag { display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 1px 7px; border-radius: 6px; background: var(--cap); color: #fff; font: 400 15px/1.3 var(--display); letter-spacing: 0.08em; }
  .claims { display: grid; gap: 10px; counter-reset: c; }
  .claim {
    position: relative; text-align: left; display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 10px;
    min-height: 64px; padding: 10px 12px; border-radius: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
    box-shadow: 4px 5px 0 var(--shadow); font-weight: 800; font-size: clamp(15px, 4.3vw, 18px); line-height: 1.3;
  }
  .claim::before { counter-increment: c; content: counter(c); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--yellow); font: 400 20px/1 var(--display); }
  .claim:active:not(:disabled) { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--shadow); }
  .claim:disabled { opacity: 1; }
  .claim.wait { opacity: 0.65; }
  .claim.fact { background: var(--fact); }
  .claim.fact::before { content: "✓"; background: var(--ink); color: var(--fact); }
  .claim.cap { background: var(--cap); color: #fff; }
  .claim.cap::before { content: "✕"; color: var(--cap); background: #fff; }
  .claim.done:not(.fact):not(.cap) { opacity: 0.55; }
  .claim:has(.stamp) { padding-right: 88px; }
  .claim .stamp { position: absolute; right: 10px; top: 50%; margin-top: -14px; padding: 2px 8px; border-radius: 6px; border: 2.5px solid var(--ink); font: 400 17px/1.2 var(--display); letter-spacing: 0.08em; transform: rotate(4deg); white-space: nowrap; }
  .claim.fact .stamp { background: var(--ink); color: var(--fact); }
  .claim.cap .stamp { background: var(--yellow); color: var(--ink); animation: slam 0.35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes slam { from { transform: scale(2) rotate(-12deg); opacity: 0; } }
  .status { text-align: center; font-weight: 900; font-size: 16px; min-height: 22px; }
  .status.bad { color: var(--cap); }
  .status.good { color: var(--fact); }
  .real { background: var(--panel2); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
  .real small { font-size: 11px; font-weight: 900; letter-spacing: 0.1em; color: var(--yellow); }
  .real span { font-weight: 700; font-size: 15px; line-height: 1.45; }
  .scores { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .scores li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 2.5px solid var(--ink); font-weight: 800; }
  .scores li .nm { overflow-wrap: anywhere; }
  .scores li .how { font-size: 12px; color: var(--dim); font-weight: 800; }
  .scores li b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--yellow); letter-spacing: 0.04em; }
  .scores li.me { border-color: var(--yellow); }
  .scores li.top { background: var(--yellow); color: var(--ink); }
  .scores li.top b, .scores li.top .how { color: var(--ink); }
  .bigscore { text-align: center; font-family: var(--display); font-size: clamp(64px, 22vw, 110px); line-height: 0.9; color: var(--yellow); text-shadow: 4px 4px 0 var(--cap), 7px 7px 0 var(--shadow); }

  /* ---------- sheets, toast ---------- */
  .veil { position: fixed; inset: 0; z-index: 40; background: rgba(5, 3, 14, 0.72); display: grid; align-items: end; justify-items: center; }
  .sheet {
    position: relative; width: 100%; max-width: 560px; max-height: calc(100dvh - var(--st) - 24px); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    background: var(--night); border: 3px solid var(--ink); border-bottom: 0; border-radius: 22px 22px 0 0; grid-template-columns: minmax(0, 1fr);
    padding: 18px calc(var(--sr) + 18px) calc(var(--sb) + 22px) calc(var(--sl) + 18px); display: grid; gap: 14px; animation: up 0.3s cubic-bezier(.2, 1.2, .4, 1);
  }
  @media (min-width: 700px) { .veil { align-items: center; } .sheet { border-radius: 22px; border-bottom: 3px solid var(--ink); max-height: 86vh; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { font-size: 28px; color: var(--yellow); padding-right: 48px; }
  .sheet .x { position: absolute; right: 14px; top: 14px; }
  .sheet ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.45; color: var(--dim); }
  .sheet ul b { color: var(--paper); }
  .toast {
    position: fixed; left: 50%; top: calc(var(--st) + 12px); transform: translate(-50%, calc(-100% - var(--st) - 24px)); z-index: 60; max-width: min(92vw, 460px);
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 5px 0 var(--shadow);
    padding: 10px 14px; font-weight: 800; font-size: 14px; transition: transform 0.25s; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { background: #FFD3DA; }
  @media (prefers-reduced-motion: reduce) { .banner .mic, .claim.cap .stamp { animation: none; } }
</style>
</head>
<body>

<section class="screen" id="home">
  <header class="bar">
    <capra-lab-chip></capra-lab-chip>
    <div class="bar-right"><button class="round-btn" type="button" data-help aria-label="How to play">?</button></div>
  </header>
  <main class="wrap">
    <div class="hero">
      <h1 class="logo" aria-label="No Cap"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 40c0-16 10-26 24-26s22 9 23 22l7 2c2 1 1 4-1 4H10c-1 0-2-1-2-2z" fill="#3D7BFF" stroke="#0E0C1C" stroke-width="4" stroke-linejoin="round"/><path d="M30 14c-6 6-8 15-8 26" fill="none" stroke="#0E0C1C" stroke-width="3"/><circle cx="32" cy="32" r="28" fill="none" stroke="#FF3B5C" stroke-width="6"/><path d="M12 52L52 12" stroke="#FF3B5C" stroke-width="6" stroke-linecap="round"/></svg>NO CAP</h1>
      <p class="tagline">Three facts. One cap. Someone reads it with a straight face; you find the facts.</p>
      <p class="brewnote" id="brewNote" hidden>🧪 Brewing in Capra’s Lab</p>
    </div>
    <section class="card" id="startCard" hidden>
      <h2>Play</h2>
      <p class="as" id="asLine"></p>
      <label class="field" id="nameField"><span>YOUR NAME</span><input id="nameIn" maxlength="17" autocomplete="off" placeholder="Name"></label>
      <button class="btn big wide" type="button" id="hostBtn">Host a game</button>
      <button class="btn big wide cyan" type="button" id="soloBtn">Play solo</button>
      <p class="note">Host for friends in the same room: everyone takes turns reading. Solo plays ten cards on your own; then send a friend the same ten.</p>
    </section>
    <section class="card" id="joinCard">
      <h2>Join a game</h2>
      <label class="field"><span>ROOM CODE</span><input class="code" id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></label>
      <label class="field" id="joinNameField"><span>YOUR NAME</span><input id="joinNameIn" maxlength="17" autocomplete="off" placeholder="Name"></label>
      <button class="btn big wide" type="button" id="joinBtn">Join</button>
    </section>
  </main>
</section>

<section class="screen" id="lobby" hidden>
  <header class="bar"><button class="round-btn" type="button" data-leave aria-label="Leave">✕</button><span class="bar-title" id="lobbyDeck"></span><button class="round-btn" type="button" data-help aria-label="How to play">?</button></header>
  <main class="wrap" id="lobbyBody"></main>
</section>

<section class="screen" id="play" hidden>
  <header class="bar"><button class="round-btn" type="button" data-leave aria-label="Leave">✕</button><span class="bar-title" id="playDeck"></span><span class="round-btn" id="myScore" aria-label="Your score">0</span></header>
  <main class="wrap" id="playBody" aria-live="polite"></main>
</section>

<section class="screen" id="chall" hidden>
  <header class="bar"><capra-lab-chip></capra-lab-chip><button class="round-btn" type="button" data-help aria-label="How to play">?</button></header>
  <main class="wrap" id="challBody"></main>
</section>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="/no-cap/game.js"></script>
<script src="/lab/chip.js" defer></script>
</body>
</html>
