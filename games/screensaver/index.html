<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script src="/lab/fill.js"></script>
<title>Screensaver · Capra Lab</title>
<meta name="description" content="It bounces. It pauses. Call the corner it hits dead on. A Capra Lab daily game.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capra Lab">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@600;700;800;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #04040A;
    --night: #05060F;
    --panel: #11132A;
    --panel2: #1B1E3E;
    --paper: #F4F6FF;
    --osd: #62FF8A;
    --cyan: #3BE7FF;
    --yellow: #FFD23F;
    --pink: #FF4FB4;
    --red: #FF4D5E;
    --shadow: #000;
    --dim: rgba(244, 246, 255, 0.7);
    --display: Bangers, Impact, "Arial Narrow Bold", system-ui, sans-serif;
    --vt: VT323, ui-monospace, "Courier New", monospace;
    --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right);
    --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
    --gut: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; background: var(--night); color: var(--paper);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  /* scanlines over everything, like an old monitor */
  body::after { content: ""; position: fixed; inset: 0 0 auto; height: var(--lab-h, 100%); pointer-events: none; z-index: 30;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px); }
  /* an opaque strip behind the iPhone clock, so nothing scrolls into it */
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--st); background: var(--night); z-index: 35; pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: 0.45; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; font-weight: 400; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(var(--st) + 10px) max(var(--gut), var(--sr)) 6px max(var(--gut), var(--sl)); max-width: 640px; margin: 0 auto;
  }
  .round-btn { flex: none; min-width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; padding: 0 12px;
    background: var(--panel); border: 2px solid #2A2E5C; font: 400 22px/1 var(--vt); color: var(--paper); }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    padding: 4px calc(var(--sr) + var(--gut)) calc(var(--sb) + 28px) calc(var(--sl) + var(--gut)); }
  .vt { font-family: var(--vt); }
  .muted { color: var(--dim); }

  /* ---------- home ---------- */
  .tv { position: relative; border-radius: 22px; padding: 10px; background: linear-gradient(#2A2D45, #15172A); border: 3px solid var(--ink); box-shadow: 0 0 0 2px #3B3F66, 6px 7px 0 var(--shadow); }
  .tv canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; background: #000; }
  .tv .title { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font: 400 min(12.5vw, 72px)/0.9 var(--vt); letter-spacing: 0.02em; white-space: nowrap; color: var(--paper);
    text-shadow: 3px 0 var(--pink), -3px 0 var(--cyan); pointer-events: none; }
  .tag { margin: 0; text-align: center; color: var(--dim); font-weight: 700; font-size: 15px; line-height: 1.4; }
  .brewnote { justify-self: center; margin: 0; display: inline-flex; gap: 6px; align-items: center; background: var(--panel); border: 2px dashed rgba(255, 210, 63, 0.6); color: var(--yellow);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; }
  .card { background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 0 0 2px #262A55, 5px 6px 0 var(--shadow); padding: 16px; display: grid; gap: 12px; }
  .card h2 { font: 400 30px/1 var(--vt); color: var(--osd); letter-spacing: 0.04em; }
  .note { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 18px; border-radius: 14px; border: 3px solid var(--ink);
    background: var(--yellow); color: var(--ink); box-shadow: 4px 5px 0 var(--shadow); font: 400 22px/1 var(--display); letter-spacing: 0.06em; text-decoration: none; }
  .btn:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn.alt { background: var(--panel2); color: var(--paper); }
  .btn.cyan { background: var(--cyan); }
  .btn.wide { width: 100%; }
  .board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .board li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--panel2); font-weight: 800; }
  .board li span:first-child { font: 400 22px/1 var(--vt); color: var(--dim); text-align: center; }
  .board li .nm { overflow-wrap: anywhere; }
  .board li b { font: 400 26px/1 var(--vt); color: var(--osd); }
  .board li.me { outline: 2px solid var(--yellow); }
  .board li small { display: block; font-size: 11px; color: var(--dim); font-weight: 800; }

  /* ---------- the game ---------- */
  #game .bar .lvl { font: 400 28px/1 var(--vt); color: var(--osd); letter-spacing: 0.06em; }
  #game .bar .pts { font: 400 28px/1 var(--vt); color: var(--yellow); min-width: 40px; text-align: right; }
  .stage { max-width: 600px; margin: 0 auto; padding: 0 calc(var(--sr) + 10px) 0 calc(var(--sl) + 10px); display: grid; gap: 8px; }
  .hud { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .lives { font-size: 22px; letter-spacing: 4px; color: var(--red); }
  .lives i { font-style: normal; opacity: 0.25; }
  .osd { font: 400 26px/1 var(--vt); color: var(--osd); letter-spacing: 0.08em; text-shadow: 0 0 8px rgba(98, 255, 138, 0.6); }
  .osd.pause { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .screen-box { position: relative; border-radius: 16px; padding: 8px; background: linear-gradient(#262942, #111325); border: 3px solid var(--ink); box-shadow: 0 0 0 2px #333866; }
  #cv { display: block; width: 100%; border-radius: 10px; background: #000; touch-action: none; }
  .prompt { text-align: center; display: grid; gap: 8px; min-height: 104px; align-content: start; padding: 2px 0 calc(var(--sb) + 10px); }
  .prompt .say { margin: 0; font: 400 clamp(22px, 7.2vw, 30px)/1 var(--vt); letter-spacing: 0.04em; white-space: nowrap; }
  .prompt .say.good { color: var(--osd); }
  .prompt .say.bad { color: var(--red); }
  .prompt .soon { margin: 0; font: 400 22px/1 var(--vt); letter-spacing: 0.12em; color: var(--dim); }
  .timer { height: 12px; border-radius: 999px; background: var(--panel2); overflow: hidden; border: 2px solid var(--ink); }
  .timer i { display: block; height: 100%; background: var(--osd); transform-origin: left; }
  .timer.low i { background: var(--red); }
  .big { text-align: center; font: 400 clamp(80px, 26vw, 128px)/0.85 var(--vt); color: var(--osd); text-shadow: 4px 0 var(--pink), -4px 0 var(--cyan); }

  /* ---------- sheet, toast ---------- */
  .veil { position: fixed; inset: 0 0 auto; height: var(--lab-h, 100%); z-index: 40; background: rgba(0, 0, 0, 0.72); display: grid; align-items: end; justify-items: center; }
  .sheet { position: relative; width: 100%; max-width: 560px; max-height: calc(100dvh - var(--st) - 24px); overflow-y: auto; background: var(--night); border: 3px solid var(--ink); border-bottom: 0;
    border-radius: 22px 22px 0 0; padding: 18px calc(var(--sr) + 18px) calc(var(--sb) + 22px) calc(var(--sl) + 18px); display: grid; gap: 12px; }
  @media (min-width: 700px) { .veil { align-items: center; } .sheet { border-radius: 22px; border-bottom: 3px solid var(--ink); } }
  .sheet h2 { font: 400 34px/1 var(--vt); color: var(--osd); padding-right: 48px; }
  .sheet .x { position: absolute; right: 14px; top: 14px; }
  .sheet ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; line-height: 1.45; color: var(--dim); }
  .sheet ul b { color: var(--paper); }
  .toast { position: fixed; left: 50%; top: calc(var(--st) + 12px); transform: translate(-50%, calc(-100% - var(--st) - 24px)); z-index: 60; max-width: min(92vw, 460px);
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 14px; transition: transform 0.25s; text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .osd.pause { animation: none; } }
</style>
</head>
<body>

<section class="screen" id="home">
  <header class="bar">
    <capra-lab-chip></capra-lab-chip>
    <button class="round-btn" type="button" data-help aria-label="How to play">?</button>
  </header>
  <main class="wrap">
    <div class="tv"><canvas id="demo" aria-hidden="true"></canvas><h1 class="title">SCREENSAVER</h1></div>
    <p class="tag">It bounces. It pauses. Call the corner it hits dead on.</p>
    <p class="brewnote" id="brewNote" hidden>🧪 Brewing in Capra’s Lab</p>
    <section class="card" id="todayCard">
      <h2 id="todayTitle">TODAY’S RUN</h2>
      <p class="note" id="todayNote">The same boards for everyone today. Three wrong corners and the run is over.</p>
      <div class="cardbox" id="lifeBox" hidden><lab-card-offer k="ss-life" for="run" id="lifeOffer"></lab-card-offer></div>
      <button class="btn wide" type="button" id="dailyBtn">Play today’s run</button>
      <button class="btn alt wide" type="button" id="practiceBtn">Practice</button>
    </section>
    <section class="card">
      <h2>TODAY’S BOARD</h2>
      <ul class="board" id="board"><li><span></span><span class="nm muted">Loading…</span><b></b></li></ul>
    </section>
  </main>
</section>

<section class="screen" id="game" hidden>
  <header class="bar">
    <button class="round-btn" type="button" id="quitBtn" aria-label="End run and count my points">✕</button>
    <span class="lvl" id="lvl">LEVEL 1</span>
    <span class="pts" id="pts">0</span>
  </header>
  <div class="stage">
    <div class="hud"><span class="lives" id="lives" aria-label="Lives"></span><span class="osd" id="osd">▶ PLAY</span></div>
    <div class="screen-box"><canvas id="cv" aria-label="The screensaver"></canvas></div>
    <div class="prompt" id="prompt" aria-live="polite"></div>
  </div>
</section>

<section class="screen" id="over" hidden>
  <header class="bar"><capra-lab-chip></capra-lab-chip><button class="round-btn" type="button" data-help aria-label="How to play">?</button></header>
  <main class="wrap" id="overBody"></main>
</section>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="/screensaver/game.js"></script>
<script src="/lab/chip.js" defer></script>
<script src="/lab/share.js" defer></script>
<script src="/lab/wallet.js" type="module"></script>
<script src="/lab/card-offer.js" type="module"></script>
</body>
</html>
